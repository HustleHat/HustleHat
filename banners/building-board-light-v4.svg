    <text x="30" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1f2328">Noble</text>
    <text x="200" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#59636e" textLength="218.4" lengthAdjust="spacing">Language model, from scratch</text>
    <rect x="598" y="4" width="175" height="7" rx="3.5" fill="#d1d9e0"/>
    <rect x="598" y="4" width="70.0" height="7" rx="3.5" fill="#9333ea"/>
